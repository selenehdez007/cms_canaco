{% extends 'partials/sidebar_base.html' %}
{% load static %}
{% block title %}Editar Categoría{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow rounded">
        <div class="card-body">
            <h3 class="mb-4 text-center">Editar Categoría</h3>
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" value="{{ categoria.nombre }}" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-header-style">Guardar Cambios</button>
                    <a href="{% url 'home:crud_categorias' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
